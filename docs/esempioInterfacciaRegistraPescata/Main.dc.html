<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nuova battuta</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,sans-serif;color:#222}
label{display:block;font-size:13px;color:#555;margin-bottom:4px}
select,input,textarea{width:100%;box-sizing:border-box;height:44px;padding:0 10px;font-size:16px;border:1px solid #999;border-radius:8px;background:#fff}
textarea{height:80px;padding:10px;font-family:inherit}
button{height:44px;border:1px solid #666;border-radius:8px;background:#fff;font-size:16px;padding:0 14px;width:100%}
.f{margin-bottom:14px}
.card{border:1px solid #bbb;border-radius:12px;padding:14px;margin-bottom:14px;background:#fafafa}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.row label{flex:1;margin:0;font-size:16px;color:#222}
.row input{width:90px;text-align:center}
.h{font-size:12px;color:#777;margin:0 0 8px}
h2{font-size:17px;margin:20px 0 10px}
</style>
</helmet>
<div style="width:390px;height:1480px;box-sizing:border-box;padding:16px;background:#fff">
<h1 style="margin:0 0 16px;font-size:22px">Nuova battuta</h1>
<div class="f"><label for="spot">Spot</label><select id="spot"><option selected="">Almenno</option><option>Giongo</option><option>Clanezzo1</option></select></div>
<div class="f"><label for="data">Data</label><input id="data" type="date" value="2026-10-04"></div>
<div class="f"><label for="fascia">Fascia oraria</label><select id="fascia"><option>Alba</option><option selected="">Mattina</option><option>Pomeriggio</option><option>Sera</option></select></div>
<div class="f"><label for="note">Note (facoltative)</label><textarea id="note"></textarea></div>
<div class="f"><button type="button">+ Aggiungi foto</button></div>
<h2>Catture</h2>
<div class="card">
<div class="f"><label for="sp1">Specie</label><select id="sp1"><option selected="">Trota</option><option>Temolo</option><option>Barbo</option></select></div>
<div class="f"><label for="t1">Totale catture</label><input id="t1" type="number" value="7"></div>
<p class="h">Caratteristiche (facoltative): ogni valore non può superare il totale (7)</p>
<div class="row"><label for="c1">Over 30</label><input id="c1" type="number" value="5"></div>
<div class="row"><label for="c2">Over 35</label><input id="c2" type="number" value="2"></div>
<div class="row"><label for="c3">Over 40</label><input id="c3" type="number"></div>
<div class="row"><label for="c4">Over 50</label><input id="c4" type="number"></div>
</div>
<div class="card">
<div class="f"><label for="sp2">Specie</label><select id="sp2"><option>Trota</option><option selected="">Temolo</option><option>Barbo</option></select></div>
<div class="f"><label for="t2">Totale catture</label><input id="t2" type="number" value="2"></div>
<p class="h">Nessuna caratteristica definita per questa specie (si aggiungono dalle impostazioni)</p>
</div>
<div class="f"><button type="button">+ Aggiungi specie</button></div>
<p style="margin:16px 0;font-size:15px">Totale battuta: <b>9 catture</b></p>
<button type="button" style="background:#222;color:#fff">Salva battuta</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
